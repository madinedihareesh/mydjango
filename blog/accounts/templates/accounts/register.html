{% extends 'base.html'%}
{%block title%}Registration Form {%endblock title %}
{%block base%}
   <h1 class="text-center">Register Form</h1>
<div class="container">
{{form.non_field_errors}}
<form action="" method="POST">
    {%csrf_token%}
    {%for field in form%}
    {{field.label_tag}}
    {{field}}
    {{field.errors}}
    {%endfor%}
    <button type="submit" class="btn btn-primary">Register</button>
</form>
</div>
{%endblock base%}
